# Ludothèque — ludo.tezcat.fr
#
# Shipped by this repo's deploy pipeline to ~/opt/edge/conf.d/10-silence.conf on
# the host. It is owned here, not in tezcat-edge, because it encodes application
# knowledge — which routes stream, which are slow — that should change in the
# same commit as the code that makes them so.
#
# The snippets and the `resolver` this relies on come from tezcat-edge.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ludo.tezcat.fr;

    ssl_certificate     /etc/letsencrypt/live/ludo.tezcat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ludo.tezcat.fr/privkey.pem;

    # Server level, once. nginx does not merge add_header across levels, so any
    # location that sets a header of its own must re-include this.
    include /etc/nginx/conf.d/snippets/security-headers.inc;

    # Upstreams go through variables so the Docker resolver in 00-defaults.conf
    # looks them up per request. With a literal name nginx resolves at startup
    # and refuses to start when this app is down — which would take down every
    # other app on the edge with it.
    set $silence_api http://silence-backend:8000;
    set $silence_web http://silence-web;

    # The app was served under /silence/ on this host too, not just on the apex,
    # so those URLs need retiring here as well. Without this they fall through to
    # the SPA catch-all below and return 200 with an app whose router has no such
    # route — a blank page rather than an honest redirect. Query string is
    # preserved, which is what keeps outstanding invite and reset links working.
    rewrite ^/silence/?(.*)$ /$1 permanent;

    location /auth/ {
        proxy_pass $silence_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    }

    # Server-sent events. Buffering off or the client receives nothing until a
    # buffer fills, and the read timeout has to outlive a quiet stream.
    location = /games/resolution-stream {
        proxy_pass $silence_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # POST /<slug>/igdb-refresh re-resolves a game's appearances synchronously
    # against the 4 req/s IGDB limiter; the default 60s is not enough.
    location /games/ {
        proxy_pass $silence_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 120s;
    }

    # The catalog endpoint has no trailing slash, so it does not match the
    # prefix location above. Without this exact match it falls through to the
    # SPA and the client is served index.html where it expected JSON.
    location = /games {
        proxy_pass $silence_api;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $silence_web;
        include /etc/nginx/conf.d/snippets/proxy-headers.inc;
    }
}
