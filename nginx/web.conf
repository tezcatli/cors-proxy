# Static server for the SPA, baked into the silence-web image.
#
# Plain HTTP on :80, no TLS and no security headers: this container is only ever
# reached from the edge, which terminates TLS and owns those headers. Adding
# them here too would just mean two places to keep in sync.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Lets the compose healthcheck probe this container without depending on the
    # SPA's own routing. Not exposed publicly — the edge proxies /silence only.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # A regex location wins over a prefix one, so this is matched before the
    # /silence block below. Filenames are content-hashed, so they are immutable
    # for as long as they exist.
    location ~* ^/silence/assets/ {
        root /var/www/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached: a client that keeps booting the previous
    # build asks for asset hashes that are no longer in the image.
    location /silence {
        root /var/www/;
        try_files $uri /silence/index.html;
        add_header Cache-Control "no-cache" always;
    }
}
