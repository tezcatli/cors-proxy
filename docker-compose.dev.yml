services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "5000:5000"
    environment:
      DEBUG: "true"
      LOGGER_LEVEL: "DEBUG"
      # The app is opened through Vite (:5173); :5000 is the API alone, so
      # invite/reset links must point at Vite. Overrides backend_secrets.env.
      RESET_BASE_URL: "http://localhost:5173"
      # Prod produces, dev consumes: no background ingestion of every episode
      # here — pull prod's (pull-prod-data.sh), or ingest a sample by hand:
      #   docker compose -f docker-compose.dev.yml run --rm backend python ingest.py <episode>...
      INGEST: "false"
    env_file:
      - path: ./backend_secrets.env
        required: true
    healthcheck:
      # curl is not in the python image, so probe /healthz with the stdlib — the
      # curl version failed every time and left the container marked unhealthy.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend:/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
